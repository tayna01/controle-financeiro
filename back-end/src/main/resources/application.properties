spring.application.name=sistema-financeiro

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeiro?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

management.endpoints.web.exposure.include=health
