spring.application.name=sistema-financeiro

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeiro?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:chave_secreta_do_sistema_financeiro_32_caracteres_minimo}
jwt.expiration=${JWT_EXPIRATION:86400000}

security.rate-limit.auth.max-requests=${AUTH_MAX_REQUESTS:5}
security.rate-limit.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}

management.endpoints.web.exposure.include=health