spring.application.name=sistema-financeiro

spring.config.import=optional:file:./application-secrets.properties

spring.config.import=classpath:application-secrets.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

security.rate-limit.auth.max-requests=${AUTH_MAX_REQUESTS:5}
security.rate-limit.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.debug-tokens=${APP_DEBUG_TOKENS:false}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
logging.level.org.springframework.data.web=ERROR